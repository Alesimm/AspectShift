[package]
name = "AspectShift"
version = "1.4.0"
edition = "2021"
authors = ["Alexander Simpertigue"]
description = "Utilidad nativa en Rust para cambiar resoluciones y relaciones de aspecto en Windows"
license = "MIT"

[[bin]]
name = "AspectShift"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow"] }
egui = { version = "0.29", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_Networking_WinHttp",
    "Win32_Devices_Display",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
